<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archetype — live viewer</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --line: #2a3340;
      --text: #e6edf3;
      --muted: #8b9bb0;
      --ok: #3fb950;
      --bad: #f85149;
      --warn: #d29922;
      --accent: #58a6ff;
      --pass-bg: rgba(63, 185, 80, 0.14);
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-width: 0; }
    .group {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #0e1116;
    }
    .pill {
      display: inline-block;
      min-width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }
    .pill.on { background: var(--ok); box-shadow: 0 0 8px rgba(63,185,80,.45); }
    .pill.off { background: var(--bad); }
    .label { color: var(--muted); margin-right: 4px; }
    button {
      font: inherit;
      color: var(--text);
      background: #21262d;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: #fff; }
    button:disabled { opacity: 0.45; cursor: default; }
    .note {
      color: var(--warn);
      font-size: 11px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ellipsis {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .tip {
      position: relative;
      min-width: 0;
    }
    .tip .tip-body {
      display: none;
      position: absolute;
      left: 0;
      top: calc(100% + 4px);
      z-index: 40;
      min-width: 220px;
      max-width: min(480px, 70vw);
      max-height: 220px;
      overflow: auto;
      padding: 8px 10px;
      background: #0d1117;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      font-size: 12px;
    }
    .tip:hover .tip-body { display: block; }
    main {
      display: grid;
      grid-template-rows: auto 1fr;
      height: calc(100vh - 53px);
      min-height: 0;
    }
    .status {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px 14px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: #12161c;
    }
    .status .k { color: var(--muted); font-size: 11px; }
    .status .v { color: var(--text); }
    .stage {
      display: grid;
      grid-template-columns: minmax(380px, 48%) 1fr;
      min-height: 0;
      height: 100%;
    }
    @media (max-width: 900px) {
      .stage { grid-template-columns: 1fr; grid-template-rows: 42% 1fr; }
      .status { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .agent-panel, .coin-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .agent-panel { border-right: 1px solid var(--line); }
    .panel-h {
      margin: 0;
      padding: 8px 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .log {
      flex: 1;
      overflow: auto;
      padding: 8px 10px;
      font-size: 12px;
    }
    .row {
      padding: 7px 8px;
      border-bottom: 1px solid #1c2330;
      border-radius: 4px;
    }
    .row.agent { border-left: 2px solid var(--accent); margin-bottom: 4px; background: #12161c; }
    .row.archive {
      border-left: 2px solid var(--muted);
      background: #10141a;
      margin-bottom: 8px;
      cursor: default;
    }
    .row.pass-flash {
      background: var(--pass-bg);
      border: 1px solid rgba(63,185,80,.35);
      margin-bottom: 6px;
    }
    .row.fail-flash {
      opacity: 0.55;
      border-left: 2px solid var(--bad);
      background: #14181f;
      margin-bottom: 4px;
    }
    .row.fail-flash .tag { color: var(--bad); }
    .row .meta { color: var(--muted); }
    .tag { font-weight: 600; margin-right: 6px; text-transform: uppercase; color: var(--accent); }
    .archive .tag { color: var(--muted); }
    .row-preview {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-full {
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 6px;
      color: var(--text);
      max-height: 240px;
      overflow: auto;
      border-top: 1px solid var(--line);
      padding-top: 6px;
    }
    .row:hover .row-full { display: block; }
    .row:hover .row-preview { white-space: normal; overflow: visible; }
    .coin-panel {
      align-items: center;
      justify-content: flex-start;
      padding: 28px 24px 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(88,166,255,0.08), transparent 55%),
        var(--bg);
      overflow: auto;
    }
    .coin-card {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 22px 22px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .coin-card.empty { opacity: 0.55; }
    .coin-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .coin-sym {
      color: var(--accent);
      font-size: 14px;
      margin-bottom: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .coin-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 6px 12px;
      font-size: 12px;
    }
    .coin-grid .k { color: var(--muted); }
    .coin-grid .v {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .coin-phase {
      display: inline-block;
      margin-top: 14px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .coin-phase.on { color: var(--ok); border-color: rgba(63,185,80,.4); }
    .group.demo-group { border-color: rgba(88,166,255,.45); }
    button.demo-btn {
      background: rgba(88,166,255,.18);
      border-color: rgba(88,166,255,.55);
      color: #fff;
    }
    button.demo-btn:hover { border-color: var(--accent); background: rgba(88,166,255,.28); }
    .pill.demo { background: var(--accent); box-shadow: 0 0 8px rgba(88,166,255,.45); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/static/logo.png" alt="Archetype" />
      <h1>Archetype live</h1>
    </div>
    <div class="controls">
      <div class="group demo-group">
        <button id="btnLoadDemo" class="demo-btn" type="button">load demo</button>
      </div>
      <div class="group">
        <span class="pill" id="ollamaPill"></span>
        <span class="label">ollama</span>
        <button id="btnOllamaStart" type="button">start</button>
        <button id="btnOllamaStop" type="button">stop</button>
      </div>
      <div class="group">
        <span class="pill" id="daemonPill"></span>
        <span class="label">daemon</span>
        <button id="btnDaemonStart" type="button">start</button>
        <button id="btnDaemonStop" type="button">stop</button>
      </div>
      <div class="group">
        <span class="pill" id="loopPill"></span>
        <span class="label">agent</span>
        <button id="btnLoopStart" type="button">start</button>
        <button id="btnLoopStop" type="button">stop</button>
      </div>
      <span class="note" id="hint" title=""></span>
    </div>
  </header>
  <main>
    <div class="status" id="statusBar">
      <div><div class="k">phase</div><div class="v tip"><div class="ellipsis" id="fPhase">—</div><div class="tip-body" id="fPhaseTip"></div></div></div>
      <div><div class="k">action</div><div class="v tip"><div class="ellipsis" id="fAction">—</div><div class="tip-body" id="fActionTip"></div></div></div>
      <div><div class="k">narrative</div><div class="v tip"><div class="ellipsis" id="fNarr">—</div><div class="tip-body" id="fNarrTip"></div></div></div>
      <div><div class="k">backlog</div><div class="v tip"><div class="ellipsis" id="fBacklog">—</div><div class="tip-body" id="fBacklogTip"></div></div></div>
      <div><div class="k">model</div><div class="v tip"><div class="ellipsis" id="fModel">—</div><div class="tip-body" id="fModelTip"></div></div></div>
      <div><div class="k">mint</div><div class="v tip"><div class="ellipsis" id="fMint">—</div><div class="tip-body" id="fMintTip"></div></div></div>
    </div>
    <div class="stage">
      <section class="agent-panel">
        <h2 class="panel-h">agent</h2>
        <div class="log" id="agentLog"></div>
      </section>
      <section class="coin-panel">
        <div class="coin-card empty" id="coinCard">
          <p class="coin-name ellipsis" id="cName" title="">waiting for focus…</p>
          <div class="coin-sym ellipsis" id="cSym" title="">—</div>
          <div class="coin-grid" id="cGrid"></div>
          <div class="coin-phase" id="cPhase">idle</div>
        </div>
      </section>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const agentLog = $("agentLog");
    let es = null;
    let lastDaemonUp = false;
    let activeMint = null;
    let openRows = []; // DOM nodes for current mint (not yet archived)
    const rejectSeen = new Set(); // one fail card per mint
    let demoMode = false;
    let demoGen = 0; // bump to cancel an in-flight script
    let demoTick = null;
    let demoState = null; // { coin, loop, live }

    function setPill(id, on) {
      const el = $(id);
      el.classList.toggle("on", !!on);
      el.classList.toggle("off", !on);
      el.classList.remove("demo");
    }

    function setDemoPills() {
      // fake "everything up" look without touching real services
      ["ollamaPill", "daemonPill", "loopPill"].forEach((id) => {
        const el = $(id);
        el.classList.remove("off");
        el.classList.add("on", "demo");
      });
    }

    function setText(id, value, title) {
      const el = $(id);
      const v = value == null || value === "" ? "—" : String(value);
      el.textContent = v;
      el.title = title != null ? String(title) : v;
      const tip = $(id + "Tip");
      if (tip) tip.textContent = title != null ? String(title) : v;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmtNum(n) {
      if (typeof n !== "number" || !isFinite(n)) return null;
      if (Math.abs(n) >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
      return String(Math.round(n * 1000) / 1000);
    }

    async function api(path, method = "GET") {
      const resp = await fetch(path, { method });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch (_) {}
      if (!resp.ok) {
        const detail = (data && data.detail) || text || resp.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return data;
    }

    function renderCoin(coin, loop, live) {
      const card = $("coinCard");
      const mint = (loop && loop.mint) || (coin && coin.mint) || "";
      if (!mint) {
        card.classList.add("empty");
        setText("cName", "waiting for focus…");
        setText("cSym", "—");
        $("cGrid").innerHTML = "";
        $("cPhase").textContent = "idle";
        $("cPhase").classList.remove("on");
        return;
      }
      card.classList.remove("empty");
      const name = (coin && coin.name) || "unknown";
      const sym = (coin && coin.symbol) || "—";
      setText("cName", name, name);
      setText("cSym", sym, sym);
      const liveMcap = live && (live.fdv_usd != null ? live.fdv_usd : live.mcap_usd);
      const mcap =
        liveMcap != null
          ? "$" + fmtNum(Number(liveMcap)) + " (live)"
          : coin.market_cap_usd != null
            ? "$" + fmtNum(Number(coin.market_cap_usd))
            : "—";
      const tp =
        live && live.profit_pct != null
          ? live.profit_pct + "%"
          : loop && loop.profit_pct != null
            ? loop.profit_pct + "%"
            : null;
      const sl =
        live && live.loss_pct != null
          ? live.loss_pct + "%"
          : loop && loop.loss_pct != null
            ? loop.loss_pct + "%"
            : null;
      const holding = !!(live && live.holding);
      let position = "—";
      if (holding) {
        const bits = [];
        if (live.value_sol != null) bits.push(fmtNum(Number(live.value_sol)) + " SOL");
        if (live.pnl_sol != null || live.pnl_pct != null) {
          const pnlSol = live.pnl_sol != null ? fmtNum(Number(live.pnl_sol)) + " SOL" : "";
          const pnlPct = live.pnl_pct != null ? (Number(live.pnl_pct) >= 0 ? "+" : "") + fmtNum(Number(live.pnl_pct)) + "%" : "";
          bits.push("pnl " + [pnlSol, pnlPct].filter(Boolean).join(" / "));
        }
        if (live.held_sec != null) bits.push("held " + live.held_sec + "s");
        position = bits.join(" · ") || "open";
      }
      const rows = [
        ["mint", mint],
        ["venue", coin.venue || coin.amm || coin.launchpad || "—"],
        ["amm", coin.amm || "—"],
        ["launchpad", coin.launchpad || "—"],
        ["mcap", mcap],
        ["tp", tp || "—"],
        ["sl", sl || "—"],
        ["position", position],
        ["fees", coin.estimated_global_fees_sol != null ? fmtNum(Number(coin.estimated_global_fees_sol)) + " SOL" : "—"],
        ["buy size", coin.buy_sol != null ? coin.buy_sol + " SOL" : (loop && loop.buy_sol) || "—"],
        ["pairing", coin.quote_symbol || coin.quote_name || (coin.quote_mint && coin.quote_mint !== "So11111111111111111111111111111111111111112" ? coin.quote_mint : "SOL")],
        ["twitter", coin.twitter || "—"],
        ["telegram", coin.telegram || "—"],
        ["website", coin.website || "—"],
        ["desc", coin.description || "—"],
      ];
      $("cGrid").innerHTML = rows.map(([k, v]) => {
        const val = v == null || v === "" ? "—" : String(v);
        return `<div class="k">${escapeHtml(k)}</div><div class="v" title="${escapeHtml(val)}">${escapeHtml(val)}</div>`;
      }).join("");
      const phase = (loop && loop.phase) || "—";
      $("cPhase").textContent = phase;
      $("cPhase").classList.toggle("on", phase === "searching" || phase === "locked");
    }

    function paintDemo() {
      if (!demoState) return;
      const { coin, loop, live } = demoState;
      setText("fModel", "llama3.2:3b (demo)");
      setText("fPhase", loop.phase || "—");
      setText("fMint", loop.mint || "—");
      setText("fAction", loop.last_action || "—");
      setText("fNarr", loop.last_narrative || "—");
      setText("fBacklog", String(loop.backlog != null ? loop.backlog : 0));
      renderCoin(coin || {}, loop || {}, live || {});
    }

    function archiveOpenMint(label) {
      if (!openRows.length) return;
      const lines = openRows.map((el) => el.dataset.full || el.dataset.preview || "").filter(Boolean);
      openRows.forEach((el) => el.remove());
      openRows = [];
      const full = lines.join("\n\n———\n\n");
      const preview = (label || "finished") + " · " + lines.length + " events · " + (lines[0] || "").slice(0, 80);
      const div = document.createElement("div");
      div.className = "row archive";
      div.title = full;
      div.innerHTML =
        `<span class="tag">done</span><span class="row-preview">${escapeHtml(preview)}</span>` +
        `<div class="row-full">${escapeHtml(full)}</div>`;
      agentLog.prepend(div);
      while (agentLog.children.length > 80) agentLog.removeChild(agentLog.lastChild);
    }

    function addAgentEvent(e) {
      const kind = e.kind || "event";
      const mint = e.mint || "";
      // decision cards titled by the real action (wait/buy/reject/hold/…)
      const label =
        kind === "decision" && e.action
          ? String(e.action)
          : kind;
      const parts = [];
      if (e.name || e.symbol) parts.push([e.name, e.symbol].filter(Boolean).join(" / "));
      if (e.reasoning) parts.push("why: " + e.reasoning);
      if (e.narrative) parts.push("narrative: " + e.narrative);
      if (e.text) parts.push(String(e.text));
      if (e.error) parts.push("error: " + e.error);
      if (e.thesis) parts.push("thesis: " + e.thesis);
      if (e.pnl_sol != null) parts.push("pnl: " + e.pnl_sol + " SOL");
      if (e.held_sec != null) parts.push("held: " + e.held_sec + "s");
      if (e.mcap_usd != null) parts.push("mcap: $" + fmtNum(Number(e.mcap_usd)));
      if (e.fees_sol != null) parts.push("fees: " + e.fees_sol + " SOL");
      if (e.buy_sol != null) parts.push("buy: " + e.buy_sol + " SOL");
      ["profit_pct", "loss_pct"].forEach((k) => {
        if (e[k] != null && e[k] !== "") parts.push(k + ": " + e[k]);
      });
      if (kind === "decision" && e.action) parts.unshift("action: " + e.action);
      const full = `[${label}] ${mint}\n` + (parts.join("\n") || JSON.stringify(e));
      const preview = `${label}  ${mint.slice(0, 8)}…  ` + (parts.find((p) => p.startsWith("why:")) || parts[0] || "").replace(/\s+/g, " ");

      // new mint while we still have open rows → archive previous
      if (activeMint && mint && mint !== activeMint && openRows.length) {
        archiveOpenMint(activeMint.slice(0, 8) + "…");
      }
      if (mint) activeMint = mint;

      const div = document.createElement("div");
      div.className = "row agent";
      div.dataset.full = full;
      div.dataset.preview = preview;
      div.title = full;
      div.innerHTML =
        `<span class="tag">${escapeHtml(label)}</span>` +
        `<span class="row-preview">${escapeHtml(preview)}</span>` +
        `<div class="row-full">${escapeHtml(full)}</div>`;
      agentLog.prepend(div);
      openRows.push(div);
      while (agentLog.children.length > 120) {
        const last = agentLog.lastChild;
        if (openRows.includes(last)) openRows = openRows.filter((x) => x !== last);
        agentLog.removeChild(last);
      }

      // trade / search finished → collapse into one block
      if (kind === "thesis" || kind === "reject" || kind === "sell") {
        archiveOpenMint((e.name || e.symbol || mint || "coin").toString().slice(0, 24));
        activeMint = null;
      }
    }

    function flashPass(m) {
      const name = m.name || m.symbol || "";
      const mint = m.mint || m.coin_mint || "";
      const full = `FILTER PASS\n${name}\n${mint}\nvenue=${m.venue || m.platform || ""}\nmcap=${m.market_cap_usd ?? ""}`;
      const div = document.createElement("div");
      div.className = "row pass-flash";
      div.title = full;
      div.innerHTML =
        `<span class="tag" style="color:var(--ok)">pass</span>` +
        `<span class="row-preview">${escapeHtml(name + "  " + mint.slice(0, 10) + "…")}</span>` +
        `<div class="row-full">${escapeHtml(full)}</div>`;
      agentLog.prepend(div);
    }

    function flashFail(m) {
      const mint = m.mint || m.coin_mint || "";
      if (!mint || rejectSeen.has(mint)) return;
      rejectSeen.add(mint);
      if (rejectSeen.size > 200) {
        const first = rejectSeen.values().next().value;
        rejectSeen.delete(first);
      }
      const name = m.name || m.symbol || "";
      const why = (m.filter_reasons || []).slice(0, 3).join("; ") || "rejected";
      const full = `FILTER REJECT\n${name}\n${mint}\n${why}`;
      const preview = `reject  ${(name || mint.slice(0, 10))}  ${why}`.replace(/\s+/g, " ");
      const div = document.createElement("div");
      div.className = "row fail-flash";
      div.title = full;
      div.innerHTML =
        `<span class="tag">reject</span>` +
        `<span class="row-preview">${escapeHtml(preview.slice(0, 140))}</span>` +
        `<div class="row-full">${escapeHtml(full)}</div>`;
      agentLog.prepend(div);
    }

    async function refresh() {
      if (demoMode) return; // scripted run owns the UI
      try {
        const s = await api("/api/status");
        setPill("ollamaPill", s.ollama && s.ollama.up);
        setPill("daemonPill", s.daemon && s.daemon.up);
        setPill("loopPill", !!(s.loop && s.loop.running));
        setText("fModel", s.ollama && s.ollama.model);
        setText("fPhase", (s.loop && s.loop.phase) || (s.daemon && s.daemon.up ? "—" : "daemon down"));
        setText("fMint", s.loop && s.loop.mint);
        setText("fAction", s.loop && s.loop.last_action);
        setText("fNarr", s.loop && s.loop.last_narrative);
        const st = s.daemon && s.daemon.status;
        setText("fBacklog", st && st.backlog_pending != null ? String(st.backlog_pending) : "—");
        setText("hint", "", "");
        renderCoin(s.coin || {}, s.loop || {}, s.live || {});
        if (s.daemon && s.daemon.up && !lastDaemonUp) connectLive();
        if (!(s.daemon && s.daemon.up) && lastDaemonUp) disconnectLive();
        lastDaemonUp = !!(s.daemon && s.daemon.up);
      } catch (e) {
        setText("hint", String(e.message || e));
      }
    }

    function disconnectLive() {
      if (es) { es.close(); es = null; }
    }

    function connectLive() {
      if (demoMode) return;
      disconnectLive();
      es = new EventSource("/api/live?filtered=false");
      es.onmessage = (ev) => {
        let data;
        try { data = JSON.parse(ev.data); } catch (_) { return; }
        if (!data || !data.stream) return;
        if (data.stream === "hello") return;
        if (data.stream === "migration") {
          const m = data.migration || {};
          if (m.filter_passed === true) flashPass(m);
          else if (m.filter_passed === false) flashFail(m);
          return;
        }
        if (data.stream === "agent") {
          addAgentEvent(data.event || {});
          // refresh coin card soon after focus
          if ((data.event || {}).kind === "focus") refresh();
        }
      };
      es.onerror = () => setText("hint", "live stream disconnected");
    }

    function bind(id, path) {
      $(id).onclick = async () => {
        if (demoMode) {
          setText("hint", "stop demo first (reload page)");
          return;
        }
        $(id).disabled = true;
        setText("hint", "…");
        try {
          await api(path, "POST");
          setText("hint", "ok");
          await refresh();
        } catch (e) {
          setText("hint", String(e.message || e));
        } finally {
          $(id).disabled = false;
        }
      };
    }

    function sleep(ms, gen) {
      return new Promise((resolve) => {
        setTimeout(() => resolve(gen === demoGen), ms);
      });
    }

    function stopDemoTicker() {
      if (demoTick) {
        clearInterval(demoTick);
        demoTick = null;
      }
    }

    function startPositionTicker(entryMcap, buySol, tpPct, slPct, opts) {
      // climb mcap toward TP so the card always shows live numbers
      stopDemoTicker();
      const fromMcap = (opts && opts.fromMcap) || entryMcap;
      const heldBase = (opts && opts.heldBase) || 0;
      const spanSec = (opts && opts.spanSec) || 12;
      const target = entryMcap * (1 + (tpPct / 100) * 1.02);
      const started = Date.now();
      demoTick = setInterval(() => {
        if (!demoMode || !demoState || !demoState.live) return;
        const elapsed = Math.floor((Date.now() - started) / 1000);
        const held = heldBase + elapsed;
        const progress = Math.min(1, elapsed / spanSec);
        const mcap = fromMcap + (target - fromMcap) * progress;
        const pnlPct = ((mcap / entryMcap) - 1) * 100;
        const pnlSol = buySol * (pnlPct / 100);
        const valueSol = buySol + pnlSol;
        demoState.live.fdv_usd = Math.round(mcap);
        demoState.live.mcap_usd = Math.round(mcap);
        demoState.live.value_sol = Math.round(valueSol * 1000) / 1000;
        demoState.live.pnl_sol = Math.round(pnlSol * 1000) / 1000;
        demoState.live.pnl_pct = Math.round(pnlPct * 10) / 10;
        demoState.live.held_sec = held;
        demoState.live.holding = true;
        demoState.live.profit_pct = tpPct;
        demoState.live.loss_pct = slPct;
        demoState.coin.market_cap_usd = Math.round(mcap);
        paintDemo();
      }, 400);
    }

    async function runLoadDemo() {
      const btn = $("btnLoadDemo");
      btn.disabled = true;
      demoGen += 1;
      const gen = demoGen;
      demoMode = true;
      disconnectLive();
      stopDemoTicker();
      lastDaemonUp = false;
      activeMint = null;
      openRows = [];
      rejectSeen.clear();
      agentLog.innerHTML = "";
      setDemoPills();
      setText("hint", "demo running (simulated — no daemon)");

      const rejects = [
        {
          mint: "RugSpRd1111111111111111111111111111111111",
          name: "RugSpread",
          symbol: "RUGS",
          filter_reasons: ["global fees 0.4 SOL < 2.0 floor"],
        },
        {
          mint: "FakeMn2222222222222222222222222222222222",
          name: "FakeMoon",
          symbol: "FMOON",
          filter_reasons: ["deployer still holds > 8% supply"],
        },
        {
          mint: "CopyCt3333333333333333333333333333333333",
          name: "CopyCat",
          symbol: "COPY",
          filter_reasons: ["narrative clone of recent pass; skipped"],
        },
      ];

      const focus = {
        mint: "NebFox4444444444444444444444444444444444",
        name: "NebulaFox",
        symbol: "NBX",
        venue: "pumpswap",
        amm: "pumpswap",
        launchpad: "pump.fun",
        market_cap_usd: 185000,
        estimated_global_fees_sol: 6.2,
        buy_sol: 0.35,
        quote_symbol: "SOL",
        twitter: "https://x.com/nebula_fox_demo",
        telegram: "https://t.me/nebula_fox_demo",
        website: "https://nebula.fox",
        description: "fox-themed memecoin migrating off pump — demo fixture",
      };

      const buySol = 0.35;
      let tpPct = 35;
      let slPct = 18;
      const entryMcap = focus.market_cap_usd;

      demoState = {
        coin: { ...focus },
        loop: {
          running: true,
          phase: "idle",
          mint: "",
          last_action: "",
          last_narrative: "",
          backlog: 3,
          buy_sol: buySol,
          profit_pct: null,
          loss_pct: null,
        },
        live: {},
      };
      paintDemo();

      const still = async (ms) => {
        const ok = await sleep(ms, gen);
        return ok && demoMode && gen === demoGen;
      };

      // 3 muted rejects first
      for (let i = 0; i < rejects.length; i++) {
        if (!(await still(900))) return;
        flashFail(rejects[i]);
        demoState.loop.backlog = 3 - i - 1;
        demoState.loop.phase = "filtering";
        demoState.loop.last_action = "filter_reject";
        demoState.loop.last_narrative = rejects[i].filter_reasons[0];
        paintDemo();
      }

      if (!(await still(1100))) return;
      flashPass({
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        venue: focus.venue,
        market_cap_usd: focus.market_cap_usd,
        filter_passed: true,
      });
      demoState.loop.backlog = 0;
      demoState.loop.phase = "searching";
      demoState.loop.mint = focus.mint;
      demoState.loop.last_action = "filter_pass";
      demoState.loop.last_narrative = "fees + deployer clean; handed to agent";
      paintDemo();

      if (!(await still(700))) return;
      addAgentEvent({
        kind: "focus",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        mcap_usd: entryMcap,
        fees_sol: focus.estimated_global_fees_sol,
      });

      if (!(await still(900))) return;
      addAgentEvent({
        kind: "thinking",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        mcap_usd: entryMcap,
        text: "scanning tools before first decision…",
      });
      demoState.loop.last_action = "thinking";
      paintDemo();

      const tools = [
        {
          kind: "metrics",
          reasoning: "mcap ~$185k, 5m volume healthy, holders climbing",
          text: "fdv=$185,000\nliq≈42 SOL\n5m vol≈11 SOL",
        },
        {
          kind: "safety",
          reasoning: "mint renounced, freeze auth none, no bundle spike",
          text: "freeze=none\nmint_auth=renounced\nbundle_pct=low",
        },
        {
          kind: "dex",
          reasoning: "dexscreener paid + socials match card",
          text: "boosted=true\npairs=1 (pumpswap)",
        },
        {
          kind: "wallets",
          reasoning: "2 tracked KOLs already in top holders",
          text: "kol_hits=2\nrank≈0.4",
        },
      ];
      for (const t of tools) {
        if (!(await still(850))) return;
        addAgentEvent({
          ...t,
          mint: focus.mint,
          name: focus.name,
          symbol: focus.symbol,
        });
        demoState.loop.last_action = t.kind;
        paintDemo();
      }

      if (!(await still(1000))) return;
      addAgentEvent({
        kind: "thinking",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        mcap_usd: entryMcap,
        text: "fees clear, KOLs present, narrative fresh — sizing a paper buy",
      });

      if (!(await still(1100))) return;
      const buyNarrative =
        "clean migration, real fees, two KOL wallets already in — buy small and set room to run";
      addAgentEvent({
        kind: "decision",
        action: "buy",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        narrative: buyNarrative,
        reasoning: "pass filters + tools agree; paper buy 0.35 SOL",
        profit_pct: tpPct,
        loss_pct: slPct,
        buy_sol: buySol,
        mcap_usd: entryMcap,
      });
      demoState.loop.last_action = "buy";
      demoState.loop.last_narrative = buyNarrative;
      demoState.loop.phase = "locked";
      demoState.loop.profit_pct = tpPct;
      demoState.loop.loss_pct = slPct;
      paintDemo();

      if (!(await still(800))) return;
      addAgentEvent({
        kind: "buy",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        sol: buySol,
        mcap_usd: entryMcap,
        profit_pct: tpPct,
        loss_pct: slPct,
      });
      demoState.live = {
        fdv_usd: entryMcap,
        mcap_usd: entryMcap,
        holding: true,
        value_sol: buySol,
        pnl_sol: 0,
        pnl_pct: 0,
        held_sec: 0,
        profit_pct: tpPct,
        loss_pct: slPct,
        price_usd: 0.00018,
      };
      paintDemo();
      startPositionTicker(entryMcap, buySol, tpPct, slPct);

      if (!(await still(3500))) return;
      addAgentEvent({
        kind: "thinking",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        mcap_usd: demoState.live.mcap_usd,
        since_last_pct: 12.4,
        since_last_sec: 8,
        text: "price grinding up — tighten SL, leave TP room",
      });
      demoState.loop.last_action = "thinking";
      paintDemo();

      if (!(await still(1200))) return;
      tpPct = 42;
      slPct = 12;
      addAgentEvent({
        kind: "revise_tpsl",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        profit_pct: tpPct,
        loss_pct: slPct,
        reasoning: "trail SL closer after +12%; stretch TP to 42%",
        narrative: "revised levels once while holding",
      });
      demoState.loop.profit_pct = tpPct;
      demoState.loop.loss_pct = slPct;
      demoState.loop.last_action = "revise_tpsl";
      demoState.loop.last_narrative = "revised TP 42% / SL 12%";
      if (demoState.live) {
        demoState.live.profit_pct = tpPct;
        demoState.live.loss_pct = slPct;
      }
      const heldSoFar = (demoState.live && demoState.live.held_sec) || 4;
      const fromMcap = (demoState.live && demoState.live.mcap_usd) || entryMcap * 1.12;
      startPositionTicker(entryMcap, buySol, tpPct, slPct, {
        fromMcap,
        heldBase: heldSoFar,
        spanSec: 8,
      });
      paintDemo();

      if (!(await still(4500))) return;
      stopDemoTicker();
      const exitMcap = Math.round(entryMcap * (1 + tpPct / 100));
      const exitPnlPct = tpPct;
      const exitPnlSol = Math.round(buySol * (exitPnlPct / 100) * 1000) / 1000;
      const exitValue = Math.round((buySol + exitPnlSol) * 1000) / 1000;
      demoState.live = {
        ...demoState.live,
        fdv_usd: exitMcap,
        mcap_usd: exitMcap,
        holding: true,
        value_sol: exitValue,
        pnl_sol: exitPnlSol,
        pnl_pct: exitPnlPct,
        profit_pct: tpPct,
        loss_pct: slPct,
      };
      demoState.coin.market_cap_usd = exitMcap;
      demoState.loop.last_action = "tp_hit";
      demoState.loop.last_narrative = "take-profit hit — closing paper fill";
      paintDemo();

      addAgentEvent({
        kind: "tpsl",
        reason: "TP",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        sol: exitValue,
        pnl_sol: exitPnlSol,
        pnl_pct: exitPnlPct,
        mcap_usd: exitMcap,
      });

      if (!(await still(700))) return;
      addAgentEvent({
        kind: "sell",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        sol: exitValue,
        pnl_sol: exitPnlSol,
        pnl_pct: exitPnlPct,
        flat: true,
      });
      demoState.live.holding = false;
      demoState.loop.phase = "closed";
      paintDemo();

      if (!(await still(900))) return;
      const thesis =
        "Bought NebulaFox after fees cleared the floor and two tracked wallets showed in holders. " +
        "Held through a steady grind, revised SL tighter once momentum stuck, then TP at +42% closed the paper round.";
      addAgentEvent({
        kind: "thesis",
        mint: focus.mint,
        name: focus.name,
        symbol: focus.symbol,
        thesis,
        pnl_sol: exitPnlSol,
        held_sec: demoState.live.held_sec || 18,
      });
      demoState.loop.last_action = "thesis";
      demoState.loop.last_narrative = thesis;
      demoState.loop.phase = "closed";
      // keep mint on the card so the ending frame still shows the round
      paintDemo();

      if (!(await still(400))) return;
      setText("hint", "demo complete — reload page for live mode");
      btn.disabled = false;
      // leave demoMode true so status polls don't clobber the ending frame
    }

    bind("btnOllamaStart", "/api/ollama/start");
    bind("btnOllamaStop", "/api/ollama/stop");
    bind("btnDaemonStart", "/api/daemon/start");
    bind("btnDaemonStop", "/api/daemon/stop");
    bind("btnLoopStart", "/api/loop/start");
    bind("btnLoopStop", "/api/loop/stop");

    $("btnLoadDemo").onclick = () => {
      runLoadDemo().catch((e) => {
        setText("hint", String(e.message || e));
        $("btnLoadDemo").disabled = false;
      });
    };

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
