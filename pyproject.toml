[project]
name = "archetype"
version = "0.1.0"
description = "Local Solana memecoin trading agent (paper-first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.2",
    "solders>=0.29.0",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.1.0",
]

[project.scripts]
archetype = "archetype.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
